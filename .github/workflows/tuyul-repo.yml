name: Tuyul Full-Repo Code Harvester
# Copyright (c) 2026 EazyWhale (https://github.com/lonion-1)
# Licensed under the MIT

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (tes tarik tanpa simpan ke repo)'
        type: boolean
        default: false
      force_refresh:
        description: 'Paksa tarik ulang meski commit SHA belum berubah'
        type: boolean
        default: false
  schedule:
    - cron: '40 17 */2 * *'

permissions:
  contents: write

concurrency:
  group: tuyul-code-harvester
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Pasang Python 3.15 Free-Threaded
        uses: actions/setup-python@v5
        with:
          python-version: '3.15t'

      - name: Jalankan Full-Repo Harvester
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, gzip, hashlib, time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # === KONFIGURASI ===
          USER_AGENT = "TuyulHarvester/2.0 (Python-3.15t)"
          TIMEOUT_SEC = 20
          MAX_WORKERS = 8
          OUTPUT_DIR = "./loot_kode"
          MANIFEST_FILE = "manifest.jsonl"
          ROTATE_MAX_BYTES = 256 * 1024 * 1024  # 256 MB per file target
          GZIP_LEVEL = 6
          MAX_SINGLE_FILE_BYTES = 2 * 1024 * 1024  # Skip file > 2MB (misal wordlist raksasa)

          DRY_RUN = os.getenv("DRY_RUN", "false").lower() == "true"
          FORCE_REFRESH = os.getenv("FORCE_REFRESH", "false").lower() == "true"
          GITHUB_TOKEN = os.getenv("GITHUB_TOKEN", "")

          # Daftar repositori target (nama file output akan mengikuti "name")
          REPOS = [
              {"name": "httpx", "repo": "projectdiscovery/httpx"},
              {"name": "subfinder", "repo": "projectdiscovery/subfinder"},
              {"name": "nuclei", "repo": "projectdiscovery/nuclei"},
              {"name": "katana", "repo": "projectdiscovery/katana"},
              {"name": "feroxbuster", "repo": "epi052/feroxbuster"},
              {"name": "phishuntangler", "repo": "bishopfox/phishuntangler"},
              {"name": "apkid", "repo": "rednaga/APKiD"},
              {"name": "certstream-server-go", "repo": "d-Rickyy-b/certstream-server-go"},
          ]

          # Ekstensi file yang relevan untuk dibedah
          ALLOWED_EXTS = {
              ".go", ".rs", ".py", ".sh", ".yaml", ".yml", ".toml",
              ".json", ".mod", ".sum", ".md", ".txt", ".c", ".h", ".js", ".ts"
          }
          ALLOWED_FILENAMES = {"Dockerfile", "Makefile", "LICENSE", "LICENSE.GPL", "LICENSE.MIT"}

          def api_get_json(url):
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "application/vnd.github+json"
              }
              if GITHUB_TOKEN:
                  headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=TIMEOUT_SEC) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def fetch_raw_file(repo_full, branch, file_path):
              encoded_path = urllib.parse.quote(file_path)
              raw_url = f"https://raw.githubusercontent.com/{repo_full}/{branch}/{encoded_path}"
              req = urllib.request.Request(raw_url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(req, timeout=TIMEOUT_SEC) as resp:
                  raw_bytes = resp.read()
                  return raw_bytes

          def is_wanted_file(path, size):
              if size > MAX_SINGLE_FILE_BYTES or size == 0:
                  return False
              base = os.path.basename(path)
              if base in ALLOWED_FILENAMES:
                  return True
              _, ext = os.path.splitext(base.lower())
              return ext in ALLOWED_EXTS

          def rotate_if_needed(file_path):
              if os.path.exists(file_path) and os.path.getsize(file_path) >= ROTATE_MAX_BYTES:
                  ts = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
                  gz_path = f"{file_path}.{ts}.gz"
                  with open(file_path, "rb") as f_in, gzip.open(gz_path, "wb", compresslevel=GZIP_LEVEL) as f_out:
                      f_out.writelines(f_in)
                  os.remove(file_path)
                  print(f"  [ROTATE] Diarsipkan ke {gz_path}")

          def load_last_commits(manifest_path):
              last_commits = {}
              if os.path.exists(manifest_path):
                  with open(manifest_path, "r", encoding="utf-8") as mf:
                      for line in mf:
                          try:
                              entry = json.loads(line)
                              last_commits[entry["name"]] = entry.get("commit_sha")
                          except Exception:
                              pass
              return last_commits

          def harvest_repo(target, last_commits):
              name = target["name"]
              repo_full = target["repo"]
              print(f"\n=== Memeriksa {name} ({repo_full}) ===")

              # 1. Ambil metadata repo (branch, license, stars, pushed_at)
              repo_meta = api_get_json(f"https://api.github.com/repos/{repo_full}")
              branch = repo_meta.get("default_branch", "main")
              license_info = repo_meta.get("license") or {}
              license_spdx = license_info.get("spdx_id") or license_info.get("name") or "NONE"
              pushed_at = repo_meta.get("pushed_at", "")
              stars = repo_meta.get("stargazers_count", 0)

              # 2. Ambil info commit terbaru di default branch
              branch_meta = api_get_json(f"https://api.github.com/repos/{repo_full}/branches/{branch}")
              commit_obj = branch_meta.get("commit", {})
              commit_sha = commit_obj.get("sha", "")
              commit_date = commit_obj.get("commit", {}).get("committer", {}).get("date", pushed_at)

              if not FORCE_REFRESH and last_commits.get(name) == commit_sha:
                  print(f"  [SKIP] Tidak ada commit baru (SHA: {commit_sha[:8]})")
                  return None

              # 3. Ambil seluruh pohon file secara rekursif
              tree_data = api_get_json(f"https://api.github.com/repos/{repo_full}/git/trees/{commit_sha}?recursive=1")
              if tree_data.get("truncated"):
                  print(f"  [WARN] Tree terpotong oleh limit GitHub API untuk {repo_full}")

              blobs = [
                  item for item in tree_data.get("tree", [])
                  if item.get("type") == "blob" and is_wanted_file(item["path"], item.get("size", 0))
              ]
              print(f"  [INFO] Branch: {branch} | License: {license_spdx} | Commit: {commit_sha[:8]} | File target: {len(blobs)}")

              if DRY_RUN:
                  return {"name": name, "status": "dry_run", "files": len(blobs)}

              # 4. Unduh semua file secara paralel
              harvested_at = datetime.now(timezone.utc).isoformat()
              records = []

              def download_worker(blob):
                  fpath = blob["path"]
                  raw_bytes = fetch_raw_file(repo_full, branch, fpath)
                  content = raw_bytes.decode("utf-8", errors="replace")
                  return {
                      "name": name,
                      "repo": repo_full,
                      "branch": branch,
                      "license": license_spdx,
                      "commit_sha": commit_sha,
                      "last_commit_date": commit_date,
                      "harvested_at": harvested_at,
                      "file_path": fpath,
                      "git_blob_sha": blob.get("sha", ""),
                      "sha256": hashlib.sha256(raw_bytes).hexdigest(),
                      "size_bytes": len(raw_bytes),
                      "lines": content.count("\n") + 1,
                      "code": content
                  }

              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  futures = {pool.submit(download_worker, b): b["path"] for b in blobs}
                  for fut in as_completed(futures):
                      fpath = futures[fut]
                      try:
                          records.append(fut.result())
                      except Exception as e:
                          print(f"  [ERR] Gagal tarik {fpath}: {e}")

              # Urutkan berdasarkan file_path agar rapi dibaca
              records.sort(key=lambda x: x["file_path"])

              # 5. Simpan ke file khusus sesuai nama target (mis. loot_kode/httpx.jsonl)
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              target_out_path = os.path.join(OUTPUT_DIR, f"{name}.jsonl")
              with open(target_out_path, "w", encoding="utf-8") as tf:
                  for rec in records:
                      tf.write(json.dumps(rec, ensure_ascii=False) + "\n")

              rotate_if_needed(target_out_path)

              total_bytes = sum(r["size_bytes"] for r in records)
              print(f"  [DONE] Tersimpan {len(records)} file ({total_bytes / 1024:.1f} KB) -> {target_out_path}")

              return {
                  "harvested_at": harvested_at,
                  "name": name,
                  "repo": repo_full,
                  "branch": branch,
                  "license": license_spdx,
                  "stars": stars,
                  "commit_sha": commit_sha,
                  "last_commit_date": commit_date,
                  "files_count": len(records),
                  "total_bytes": total_bytes,
                  "output_file": f"{name}.jsonl"
              }

          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              manifest_path = os.path.join(OUTPUT_DIR, MANIFEST_FILE)
              last_commits = load_last_commits(manifest_path)

              for target in REPOS:
                  try:
                      summary = harvest_repo(target, last_commits)
                      if summary and not DRY_RUN:
                          with open(manifest_path, "a", encoding="utf-8") as mf:
                              mf.write(json.dumps(summary, ensure_ascii=False) + "\n")
                  except Exception as e:
                      print(f"  [FATAL] Gagal memproses repo {target['repo']}: {e}")

          if __name__ == "__main__":
              main()
          EOF

      - name: Simpan hasil panen ke GitHub
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --soft "origin/$BRANCH"
            git reset HEAD -- .
            git add loot_kode

            if git diff --staged --quiet; then
              echo "Tidak ada pembaruan kode."
              exit 0
            fi

            git commit -m "chore(harvester): panen full-repo target [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
